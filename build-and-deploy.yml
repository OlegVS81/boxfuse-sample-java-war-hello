---
- name: Stage 1: Prepare build node, clone repo
  hosts: build-nodes
  become: true
  vars:
    proj_name: "hello-1"
    build_root: "/opt/build"
    project_dir: "{{ build_root }}/{{ proj_name }}"
    repo_url: "https://github.com/OlegVS81/boxfuse-sample-java-war-hello"
    registry: "81.26.184.88:5000"
    image_name: "{{ registry }}/{{ proj_name }}"
    version: "1.0.0"

  tasks:
    - name: Clone or pull project from GitHub
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: master
        update: yes    
        force: no      
      become: yes

    - name: Install Maven if not present (Ubuntu)
      apt:
        name: maven
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"


    - name: Configure insecure-registries on build node
      copy:
        content: |
          {
            "insecure-registries": ["{{ registry }}"]
          }
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"

    - name: Restart Docker on build node
      systemd:
        name: docker
        state: restarted

    - name: Login to Nexus Docker Registry
      docker_login:
        registry: "{{ registry }}"
        username: admin
        password: "{{ nexus_admin_password }}"

- name: Stage 2: build WAR
  hosts: build-nodes
  become: true
  vars:
    proj_name: "hello-1"
    build_root: "/opt/build"
    project_dir: "{{ build_root }}/{{ proj_name }}"
    repo_url: "https://github.com/OlegVS81/boxfuse-sample-java-war-hello"
    registry: "81.26.184.88:5000"
    image_name: "{{ registry }}/{{ proj_name }}"
    version: "1.0.0"

  tasks:
    - name: Build WAR file with Maven
      command: mvn clean package -DskipTests
      args:
        chdir: "{{ project_dir }}"
      register: maven_build
      failed_when: maven_build.rc != 0

    - name: Show Maven output on failure
      debug:
        msg: "{{ maven_build.stdout }}"
      when: maven_build.failed

    - name: Show Maven stderr on failure
      debug:
        msg: "{{ maven_build.stderr }}"
      when: maven_build.failed

    - name: Show Maven stderr on failure
      debug:
        msg: "{{ maven_build.stderr }}"
      when: maven_build.failed

    - name: Verify WAR file exists
      stat:
        path: "{{ project_dir }}/target/hello-1.0.war"
      register: war_stat

    - name: Fail if WAR not found
      fail:
        msg: "WAR file not found in {{ project_dir }}/target/. Check Maven build output."
      when: not war_stat.stat.exists

    - name: Show success message with path
      debug:
        msg: "Successfully found WAR file: {{ war_stat.stat.path }}"
      when: war_stat.stat.exists