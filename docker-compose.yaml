---
services:
  build:
    image: maven:3.8-openjdk-11
    working_dir: /app
    command: mvn package -DskipTests
    restart: "no"
    volumes: 
      - ".:/app"
      - "maven-cache:/root/.m2"

  hello:
    image: tomcat:9.0-jdk11-openjdk
    ports:
      - "80:8080"
    volumes: 
      - "./target/hello-1.0.war:/usr/local/tomcat/webapps/ROOT.war"
    restart: unless-stopped
    depends_on:
      - build
volumes:
  maven-cache: