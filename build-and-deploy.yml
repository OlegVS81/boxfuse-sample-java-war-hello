---
- name: Prepare build node, clone repo and build WAR
  hosts: build-nodes
  become: true
  vars:
    proj_name: "hello-1"
    build_root: "/opt/build"
    project_dir: "{{ build_root }}/{{ proj_name }}"
    repo_url: "https://github.com/OlegVS81/boxfuse-sample-java-war-hello"
    registry: "81.26.184.88:5000"
    image_name: "{{ registry }}/{{ proj_name }}"
    version: "1.0.0"

  tasks:
    - name: Ensure build directory exists
      file:
        path: "{{ build_root }}"
        state: directory
        mode: "0755"
    - name: Remove old project directory if exists
      file:
        path: "{{ project_dir }}"
        state: absent
    - name: Clone project from GitHub
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        depth: 1
        single_branch: true
        version: master
        executable: "/usr/bin/git"
    - name: Install Maven if not present (Ubuntu)
      apt:
        name: maven
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"
    - name: Build WAR file with Maven
      command: mvn clean package -DskipTests
      args:
        chdir: "{{ project_dir }}"
      register: maven_build
      failed_when: maven_build.rc != 0
