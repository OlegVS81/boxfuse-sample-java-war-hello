---
- name: Stage 1: Prepare build node and clone repo
  hosts: build-nodes
  become: true
  vars:
    proj_name: "hello-1"
    build_root: "/opt/build"
    project_dir: "{{ build_root }}/{{ proj_name }}"
    repo_url: "https://github.com/OlegVS81/boxfuse-sample-java-war-hello"
    registry: "81.26.184.88:5000" #nexus on control node
    image_name: "{{ registry }}/{{ proj_name }}"
    version: 1.0.0

  tasks:
    - name: Ensure build directory exists
      file:
        path: "{{ build_root }}"
        state: directory
        mode: "0755"

    - name: Clone project from github
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        depth: 1
        single_branch: true
        branch: master
