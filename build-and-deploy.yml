---
- name: Stage 1: Prepare build node, clone repo, configure Docker
  hosts: build-nodes
  become: true
  vars:
    proj_name: "hello-1"
    build_root: "/opt/build"
    project_dir: "{{ build_root }}/{{ proj_name }}"
    repo_url: "https://github.com/OlegVS81/boxfuse-sample-java-war-hello"
    registry: "81.26.184.88:5000"
    image_name: "{{ registry }}/{{ proj_name }}"
    version: "1.0.0"
  tasks:
    - name: Ensure build root directory exists
      file:
        path: "{{ build_root }}"
        state: directory
        mode: "0755"

    - name: Install Git, Maven, and OpenJDK on build node
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop:
        - git
        - maven
        - openjdk-11-jdk
      when: ansible_os_family == "Debian"

    - name: Clone or update project from GitHub
      git:
        repo: "{{ repo_url }}"
        dest: "{{ project_dir }}"
        version: master
        update: yes
        force: no

    - name: Configure insecure-registries on build node
      copy:
        content: |
          {
            "insecure-registries": ["{{ registry }}"]
          }
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"

    - name: Restart Docker on build node
      systemd:
        name: docker
        state: restarted

    - name: Login to Nexus Docker Registry
      docker_login:
        registry: "{{ registry }}"
        username: admin
        password: "{{ nexus_admin_password }}"


- name: Stage 2: Build WAR, Docker image, and push to Nexus
  hosts: build-nodes
  become: true
  vars:
    proj_name: "hello-1"
    build_root: "/opt/build"
    project_dir: "{{ build_root }}/{{ proj_name }}"
    registry: "81.26.184.88:5000"
    image_name: "{{ registry }}/{{ proj_name }}"
    version: "1.0.0"
  tasks:
    - name: Build WAR file with Maven
      command: mvn clean package -DskipTests
      args:
        chdir: "{{ project_dir }}"
      register: maven_build
      failed_when: maven_build.rc != 0

    - name: Show Maven stdout on failure
      debug:
        msg: "{{ maven_build.stdout }}"
      when: maven_build.failed

    - name: Show Maven stderr on failure
      debug:
        msg: "{{ maven_build.stderr }}"
      when: maven_build.failed

    - name: Verify WAR file exists
      stat:
        path: "{{ project_dir }}/target/*.war"
      register: war_stat

    - name: Fail if WAR not found
      fail:
        msg: "WAR file not found in {{ project_dir }}/target/. Check Maven build output."
      when: not war_stat.files | length > 0

    - name: Show success message with path
      debug:
        msg: "Successfully found WAR file(s): {{ war_stat.files | map(attribute='path') | list }}"
      when: war_stat.files | length > 0

    - name: Build Docker image with WAR
      docker_image:
        name: "{{ image_name }}"
        tag: "{{ version }}"
        source: build
        build:
          path: "{{ project_dir }}"
          dockerfile: Dockerfile

    - name: Push image to Nexus
      docker_image:
        name: "{{ image_name }}"
        tag: "{{ version }}"
        state: present


- name: Stage 3: Deploy application on deploy node
  hosts: deploy-nodes
  become: true
  vars:
    proj_name: "hello-1"
    registry: "81.26.184.88:5000"
    image_name: "{{ registry }}/{{ proj_name }}"
    version: "1.0.0"
  tasks:
    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started

    - name: Pull the image from Nexus
      docker_image:
        name: "{{ image_name }}"
        tag: "{{ version }}"
        state: present

    - name: Run the application container
      docker_container:
        name: hello-app
        image: "{{ image_name }}:{{ version }}"
        restart_policy: always
        ports:
          - "8080:8080"
        state: started
